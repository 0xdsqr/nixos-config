# Kubernetes >= 1.34. Keep kubeadm's unauthenticated health probes working;
# all other paths require credentials, independently of anonymous RBAC grants.
# Do not combine this with the kube-apiserver --anonymous-auth flag.
apiVersion: apiserver.config.k8s.io/v1
kind: AuthenticationConfiguration
anonymous:
  enabled: true
  conditions:
    - path: /livez
    - path: /readyz
    - path: /healthz
