name: check

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  check:
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    env:
      HOO_DEPLOY_KEY: ${{ secrets.HOO_DEPLOY_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `nix flake check` here evaluates every output (~9 GB) and starves the
          # 16 GB runner; building the checks alone peaks ~5 GB and host-eval
          # still evaluates every x86_64-linux host.
          - system: x86_64-linux
            os: ubuntu-latest
            checks-only: true
          - system: aarch64-linux
            os: ubuntu-24.04-arm
          - system: aarch64-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3.23.1
      - uses: DeterminateSystems/flakehub-cache-action@v3.23.1
      - name: Configure SSH for private flake inputs
        if: env.HOO_DEPLOY_KEY != ''
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$HOO_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Run check
        if: ${{ !matrix.checks-only }}
        run: nix flake check --system ${{ matrix.system }}
      - name: Build checks
        if: ${{ matrix.checks-only }}
        run: |
          nix eval --json '.#checks.${{ matrix.system }}' --apply builtins.attrNames \
            | jq -r '.[] | ".#checks.${{ matrix.system }}." + .' \
            | xargs nix build --no-link
