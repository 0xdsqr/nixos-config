name: check

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  check:
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    env:
      HOO_DEPLOY_KEY: ${{ secrets.HOO_DEPLOY_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            os: ubuntu-latest
          - system: aarch64-linux
            os: ubuntu-24.04-arm
          - system: aarch64-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3.23.1
      - uses: DeterminateSystems/flakehub-cache-action@v3.23.1
      # Evaluating every x86_64-linux host peaks around 9 GB, which starves the
      # 16 GB runner and kills it mid-check without uploading a log.
      - name: Add swap
        if: runner.os == 'Linux'
        run: |
          sudo swapoff -a
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
      - name: Configure SSH for private flake inputs
        if: env.HOO_DEPLOY_KEY != ''
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$HOO_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Run check
        run: nix flake check --system ${{ matrix.system }}
